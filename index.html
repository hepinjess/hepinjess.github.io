<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidal Body</title>
<meta name="description" content="Tidal Body — a space still forming.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Work+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  :root { --bg: #eef1ef; --ink: #2b3a3c; --soft: #6b7f80; }
  @media (prefers-color-scheme: dark) { :root { --bg: #122022; --ink: #dfe7e5; --soft: #93a7a6; } }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    font-family: "Work Sans", sans-serif; font-weight: 300;
  }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 300; font-size: clamp(2.6rem, 8vw, 4.5rem); letter-spacing: .04em; }
  p { margin-top: 1.2rem; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.25rem; color: var(--soft); }
  a { display: inline-block; margin-top: 3rem; color: var(--ink); font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid var(--soft); padding-bottom: 4px; }
  a:hover { border-color: var(--ink); }
</style>
</head>
<body>
  <main>
    <h1>Tidal Body</h1>
    <p>still forming, like water finding its shape</p>
    <a href="remembrance/">Oceanic Remembrance</a>
  </main>
</body>
</html>
